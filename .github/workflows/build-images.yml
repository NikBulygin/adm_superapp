name: Build and Push Images

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      AUTH_IMAGE: ghcr.io/nikbulygin/adm_auth
      FRONTEND_IMAGE: ghcr.io/nikbulygin/adm_frontend
      BACKEND_IMAGE: ghcr.io/nikbulygin/adm_backend
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_GROUP_ID: ${{ secrets.TG_GROUP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set image tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ENVIRONMENT=prod" >> "$GITHUB_ENV"
            echo "IMAGE_TAG=main-${SHORT_SHA}" >> "$GITHUB_ENV"
          else
            echo "ENVIRONMENT=dev" >> "$GITHUB_ENV"
            echo "IMAGE_TAG=dev-${SHORT_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify build started
        run: |
          MSG="project=central | branch=${GITHUB_REF_NAME} | env=${ENVIRONMENT} | stage=build | status=STARTED | pipeline=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" -d chat_id="${TG_GROUP_ID}" -d text="${MSG}" >/dev/null || true

      - name: Build images
        id: build_step
        run: make ci-build

      - name: Notify build finished
        if: always()
        run: |
          STATUS="SUCCESS"
          if [ "${{ steps.build_step.outcome }}" != "success" ]; then STATUS="FAILED"; fi
          MSG="project=central | branch=${GITHUB_REF_NAME} | env=${ENVIRONMENT} | stage=build | status=${STATUS} | pipeline=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" -d chat_id="${TG_GROUP_ID}" -d text="${MSG}" >/dev/null || true

      - name: Notify push started
        if: ${{ steps.build_step.outcome == 'success' }}
        run: |
          MSG="project=central | branch=${GITHUB_REF_NAME} | env=${ENVIRONMENT} | stage=push | status=STARTED | pipeline=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" -d chat_id="${TG_GROUP_ID}" -d text="${MSG}" >/dev/null || true

      - name: Push images
        id: push_step
        if: ${{ steps.build_step.outcome == 'success' }}
        run: make ci-push

      - name: Notify push finished
        if: ${{ steps.build_step.outcome == 'success' && always() }}
        run: |
          STATUS="SUCCESS"
          if [ "${{ steps.push_step.outcome }}" != "success" ]; then STATUS="FAILED"; fi
          MSG="project=central | branch=${GITHUB_REF_NAME} | env=${ENVIRONMENT} | stage=push | status=${STATUS} | pipeline=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" -d chat_id="${TG_GROUP_ID}" -d text="${MSG}" >/dev/null || true
