stages:
  - build
  - push

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  AUTH_IMAGE: $CI_REGISTRY_IMAGE/adm_auth
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/adm_frontend
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/adm_backend
  PROJECT_NAME: central

.before_script_common: &before_script_common
  - apk add --no-cache make git
  - git submodule sync --recursive
  - git submodule update --init --recursive
  - |
    SHORT_SHA="$(echo "$CI_COMMIT_SHA" | cut -c1-7)"
    if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
      export ENVIRONMENT="prod"
      export IMAGE_TAG="main-${SHORT_SHA}"
    else
      export ENVIRONMENT="dev"
      export IMAGE_TAG="dev-${SHORT_SHA}"
    fi
  - echo "ENVIRONMENT=${ENVIRONMENT}"
  - echo "IMAGE_TAG=${IMAGE_TAG}"

.notify_stage_start: &notify_stage_start |
  MSG="project=${PROJECT_NAME} | branch=${CI_COMMIT_REF_NAME} | env=${ENVIRONMENT} | stage=${CI_JOB_STAGE} | status=STARTED | pipeline=${CI_PIPELINE_URL}"
  curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
    -d chat_id="${TG_GROUP_ID}" \
    -d text="${MSG}" >/dev/null

.notify_stage_end: &notify_stage_end |
  STATUS="SUCCESS"
  if [ "${CI_JOB_STATUS}" != "success" ]; then STATUS="FAILED"; fi
  MSG="project=${PROJECT_NAME} | branch=${CI_COMMIT_REF_NAME} | env=${ENVIRONMENT} | stage=${CI_JOB_STAGE} | status=${STATUS} | pipeline=${CI_PIPELINE_URL}"
  curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
    -d chat_id="${TG_GROUP_ID}" \
    -d text="${MSG}" >/dev/null

build_images:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - *before_script_common
    - *notify_stage_start
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - make ci-build
  after_script:
    - *notify_stage_end
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'

push_images:
  stage: push
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - *before_script_common
    - *notify_stage_start
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - make ci-push
  after_script:
    - *notify_stage_end
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
