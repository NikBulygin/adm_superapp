events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream frontend_upstream {
    server frontend:3000;
  }

  upstream auth_upstream {
    server backend:8088;
  }

  upstream marketplace_upstream {
    server marketplace-backend:8098;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /auth/healthz {
      proxy_pass http://auth_upstream/healthz;
    }

    location = /auth/google {
      proxy_pass http://frontend_upstream/auth/google;
    }

    location = /auth/google/start {
      proxy_pass http://auth_upstream/auth/google/start;
    }

    location = /auth/google/callback {
      proxy_pass http://auth_upstream/auth/google/callback;
    }

    location /auth/ {
      proxy_pass http://auth_upstream;
    }

    location = /me {
      proxy_pass http://auth_upstream;
    }

    location /roles {
      proxy_pass http://auth_upstream;
    }

    location /roles/ {
      proxy_pass http://auth_upstream;
    }

    location /permissions {
      proxy_pass http://auth_upstream;
    }

    location /permissions/ {
      proxy_pass http://auth_upstream;
    }

    location /users {
      proxy_pass http://auth_upstream;
    }

    location /users/ {
      proxy_pass http://auth_upstream;
    }

    location = /api/marketplace/healthz {
      proxy_pass http://marketplace_upstream/healthz;
    }

    location /api/marketplace/ {
      rewrite ^/api/marketplace/(.*)$ /$1 break;
      proxy_pass http://marketplace_upstream;
    }

    location / {
      proxy_pass http://frontend_upstream;
    }
  }
}
